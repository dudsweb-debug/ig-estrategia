async function sbFetch(path,method,body,extra){
  const headers = {"apikey":SUPABASE_KEY,"Authorization":"Bearer "+((await AUTH.token())||SUPABASE_KEY),"Content-Type":"application/json","Prefer":"return=representation"};
  if(extra) Object.assign(headers,extra);
  const opts = {method:method||"GET",headers};
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(SUPABASE_URL+"/rest/v1/"+path,opts);
  const text = await res.text();
  if(res.status===401){AUTH.save(null);location.reload();}
  if(!res.ok) throw new Error(text||"Erro "+res.status);
  return text ? JSON.parse(text) : null;
}

function fmt(n){
  if(n===undefined||n===null||n==="") return "–";
  const num=Number(n); if(isNaN(num)) return "–";
  const abs=Math.abs(num);
  const prefix=num<0?"-":"";
  if(abs>=1e6) return prefix+(abs/1e6).toFixed(1)+"M";
  if(abs>=1000) return prefix+(abs/1000).toFixed(1)+"K";
  return num.toLocaleString("pt-BR");
}

const MESES={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
function periodKey(p){
  if(!p) return 0;
  const m=String(p).toLowerCase().match(/([a-zç]{3})[^0-9]*(\d{4})/);
  if(!m) return 0;
  return (Number(m[2])||0)*100+(MESES[m[1]]||0);
}
function pct(a,b){
  if(!b||!a||Number(b)===0) return null;
  return (((Number(a)-Number(b))/Number(b))*100).toFixed(1);
}
function goalSt(a,g){
  if(!a||!g) return null;
  const r=Number(a)/Number(g);
  return r>=1?"achieved":r>=0.8?"near":"behind";
}

function BigChart(p){

      ),
      changePct!==null&&h("span",{title:"Variação de "+pts[0].periodo+" a "+pts[pts.length-1].periodo,style:{fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:999,background:up?T.greenSoft:T.redSoft,color:up?T.green:T.red,whiteSpace:"nowrap"}},(up?"▲ ":"▼ ")+pctBr(changePct)+"%")

function GoalBar(p){
  if(!p.goal) return null;
  const ratio=Math.min(Number(p.actual||0)/Number(p.goal),1);
  const st=goalSt(p.actual,p.goal);
  const col=st==="achieved"?T.green:st==="near"?T.yellow:T.chart;
  return h("div",{style:{marginTop:12}},
    h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,color:T.muted,marginBottom:5}},
      h("span",null,"Meta: "+fmt(p.goal)),
      h("span",{style:{color:col,fontWeight:700}},st==="achieved"?"✓ Atingida":st==="near"?"Quase lá":Math.round(ratio*100)+"%")
    ),
    h("div",{style:{height:6,borderRadius:6,background:T.sunken}},
      h("div",{style:{height:"100%",width:(ratio*100)+"%",background:col,borderRadius:6,transition:"width .2s cubic-bezier(.2,0,0,1)"}})
    )
  );
}

}

function AddDataView({client,onAdd,onBack}){
  const [mode,setMode]=useState("choice");
  const [periodo,setPeriodo]=useState("");
  const [metrics,setMetrics]=useState({});
  const [obs,setObs]=useState("");
  const [saving,setSaving]=useState(false);
  const jsonRef=useRef();

  function setM(key,val){setMetrics(m=>Object.assign({},m,{[key]:val}));}

  function onJson(e){
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.periodo)setPeriodo(d.periodo);
        if(d.observacoes)setObs(d.observacoes);
        const rest=Object.assign({},d);delete rest.periodo;delete rest.observacoes;
        setMetrics(m=>Object.assign({},m,rest));
        setMode("manual");
      }catch{alert("JSON inválido.");}
    };
    r.readAsText(file);
  }

  async function save(){
    if(!periodo.trim()){alert("Informe o período (ex: Abr/2025).");return;}
    setSaving(true);
    await onAdd(Object.assign({periodo:periodo.trim(),observacoes:obs},metrics));
    setSaving(false);
  }

  if(mode==="choice") return h("div",{style:{maxWidth:520}},
    h(Back,{onClick:onBack}),
    h("h2",{style:{margin:"0 0 8px",fontSize:32}},"Novo período"),
    h("p",{style:{color:T.muted,fontSize:15,marginBottom:24}},"@"+client.name+" — como inserir os dados?"),
    h("div",{style:{display:"grid",gap:12}},
      [
        {ic:"upload",title:"Importar JSON do Claude",desc:"Mande prints ao Claude aqui nesta conversa, receba o JSON e importe com 1 clique",m:"json",rec:true},
        {ic:"keyboard",title:"Inserir manualmente",desc:"Digite os números organizados por tipo de conteúdo",m:"manual",rec:false}
      ].map(o=>h("div",{key:o.m,className:"card-link",

        o.rec&&h("div",{style:{position:"absolute",top:14,right:14,fontSize:11,color:T.onAction,background:T.accentMid,padding:"3px 10px",borderRadius:999,fontWeight:700}},"Recomendado"),
        h("div",{style:{marginBottom:10,color:T.text}},h(Ic,{n:o.ic,size:24})),
        h("div",{style:{fontWeight:700,fontSize:15,marginBottom:4}},o.title),
        h("div",{style:{color:T.muted,fontSize:14}},o.desc)
      ))
    ),
    h("input",{ref:jsonRef,type:"file",accept:".json",style:{display:"none"},onChange:onJson})
  );

  return h("div",{style:{maxWidth:720}},
    h(Back,{onClick:()=>setMode("choice")}),
    h("h2",{style:{margin:"0 0 22px",fontSize:32}},"Inserir dados — @"+client.name),
    h(Fld,{label:"Período *",value:periodo,onChange:setPeriodo,placeholder:"ex: Abr/2025"}),
    GROUPS.map(g=>h("div",{key:g.id},
      h(SecTitle,{label:g.label}),
      h("div",{className:"g2",style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        g.fields.map(f=>h(Fld,{key:f.key,label:f.label,value:metrics[f.key]||"",onChange:v=>setM(f.key,v),placeholder:"–",number:true}))
      )
    )),
    h(SecTitle,{label:"Público"}),
    h("div",{className:"g2",style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
      PUBLICO_FIELDS.map(f=>h(Fld,{key:f.key,label:f.label,value:metrics[f.key]||"",onChange:v=>setM(f.key,v),placeholder:"–",number:f.type==="number"}))
    ),
    h(Fld,{label:"Observações do período",value:obs,onChange:setObs,placeholder:"Campanha, feriado, lançamento...",multiline:true}),
    h("div",{style:{marginTop:20,display:"flex",gap:10,flexWrap:"wrap"}},
      h(Btn,{onClick:save,disabled:!periodo.trim()||saving},saving?"Salvando...":"Salvar período"),
      h(Btn,{outline:true,onClick:()=>setMode("choice")},"Voltar")
    )
  );
}

  const last=periods&&periods[periods.length-1];

  function PerfChart(){
    if(!periods||periods.length<2) return null;
    const metrics=[
      {key:"seguidores",label:"Seguidores",color:"#94794A"},
      {key:"alcance",label:"Alcance",color:"#4A7C59"},
      {key:"impressoes",label:"Visualizações",color:"#4A6C8C"},

    const W=560,H=130,PT=10,PB=24;

      const pts=vals.map((v,i)=>[(i/(periods.length-1))*W,PT+chartH-((v-mn)/rng)*chartH]);

function EditPeriodView({period,onSave,onBack}){
  const [data,setData]=useState(()=>{
    const d={};
    GROUPS.flatMap(g=>g.fields).forEach(f=>{d[f.key]=period[f.key]!=null&&period[f.key]!==""?period[f.key]:"";});
    d.periodo=period.periodo||"";
    d.observacoes=period.observacoes||"";
    return d;
  });
  const [saving,setSaving]=useState(false);
  function setF(key,val){setData(prev=>Object.assign({},prev,{[key]:val}));}
  async function go(){
    if(!data.periodo.trim()){alert("Informe o período.");return;}
    setSaving(true);
    const clean={periodo:data.periodo.trim(),observacoes:data.observacoes};
    GROUPS.flatMap(g=>g.fields).forEach(f=>{
      clean[f.key]=data[f.key]!==""&&data[f.key]!==null?data[f.key]:null;
    });
    await onSave(clean);
    setSaving(false);
  }
  return h("div",{style:{maxWidth:720}},
    h(Back,{onClick:onBack}),
    h("h2",{style:{margin:"0 0 6px",fontSize:32}},"Editar período"),
    h("p",{style:{color:T.muted,fontSize:15,marginBottom:22}},"Edite os dados do período e salve."),
    h(Fld,{label:"Período *",value:data.periodo,onChange:v=>setF("periodo",v),placeholder:"ex: Abr/2025"}),
    GROUPS.map(g=>h("div",{key:g.id},
      h(SecTitle,{label:g.label}),
      h("div",{className:"g2",style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        g.fields.map(f=>h(Fld,{key:f.key,label:f.label,value:data[f.key]||"",onChange:v=>setF(f.key,v),placeholder:"–",number:true}))
      )
    )),
    h(Fld,{label:"Observações",value:data.observacoes,onChange:v=>setF("observacoes",v),placeholder:"Contexto do período...",multiline:true}),
    h("div",{style:{marginTop:22,display:"flex",gap:10,flexWrap:"wrap"}},
      h(Btn,{onClick:go,disabled:!data.periodo.trim()||saving},saving?"Salvando...":"Salvar alterações"),
      h(Btn,{outline:true,onClick:onBack},"Cancelar")
    )
  );
}

// ===== Acesso: login por link no e-mail (Supabase Auth, sem biblioteca) =====
// A sessão fica no navegador. O banco só entrega dados a quem fez login e tem linha na tabela "acessos".
window.HDG_AUTH = true;
const AUTH_KEY = "hdg-painel-sessao";
const AUTH = {
  s: null, erro: "", _refresh: null,
  load(){ try{ this.s = JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); }catch(e){ this.s = null; } },
  save(s){ this.s = s; try{ s ? localStorage.setItem(AUTH_KEY, JSON.stringify(s)) : localStorage.removeItem(AUTH_KEY); }catch(e){} },
  limparUrl(){ history.replaceState(null, "", location.pathname + location.search); },
  // O link do e-mail volta com a sessão (ou o erro) depois do "#".
  fromHash(){
    if(!location.hash) return;
    const q = new URLSearchParams(location.hash.slice(1));
    if(q.get("error_description")){
      this.erro = q.get("error_code") === "otp_expired"
        ? "Esse link já foi usado ou expirou. Peça um novo abaixo."
        : "Não consegui entrar com esse link. Peça um novo abaixo.";
      this.limparUrl(); return;
    }
    const at = q.get("access_token"), rt = q.get("refresh_token");
    if(at && rt){
      this.save({ at, rt, exp: Number(q.get("expires_at")) || Math.floor(Date.now()/1000) + Number(q.get("expires_in") || 3600) });
      this.limparUrl();
    }
  },
  email(){
    try{ return JSON.parse(atob(this.s.at.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).email || ""; }catch(e){ return ""; }
  },
  refresh(){
    if(this._refresh) return this._refresh;
    this._refresh = (async () => {
      try{
        const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", { method: "POST",
          headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: this.s.rt }) });
        if(!r.ok){ this.save(null); return null; }
        const d = await r.json();
        this.save({ at: d.access_token, rt: d.refresh_token, exp: d.expires_at || Math.floor(Date.now()/1000) + d.expires_in });
        return this.s.at;
      } finally { this._refresh = null; }
    })();
    return this._refresh;
  },
  async token(){
    if(!this.s) return null;
    if(this.s.exp - 60 < Date.now()/1000) return await this.refresh();
    return this.s.at;
  },
  // create_user:false — só entra quem já foi convidado no Supabase.
  async pedirLink(email){
    const r = await fetch(SUPABASE_URL + "/auth/v1/otp?redirect_to=" + encodeURIComponent(location.origin + location.pathname), { method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ email, create_user: false }) });
    if(r.status === 429) throw new Error("Muitos pedidos seguidos. Espere alguns minutos e tente de novo.");
    if(!r.ok && r.status >= 500) throw new Error("O serviço de login não respondeu. Tente de novo em alguns minutos.");
    // E-mail sem convite também cai aqui: a resposta é a mesma, para não revelar quem tem acesso.
  },
  async sair(){
    try{ const t = await this.token(); if(t) await fetch(SUPABASE_URL + "/auth/v1/logout", { method: "POST", headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + t } }); }catch(e){}
    this.save(null); location.reload();
  }
};

function TelaAcesso({ children }){
  return h("div", { style: { background: T.bg, minHeight: "100vh", color: T.text } },
    h("div", { className: "on-dark", style: { background: T.head, padding: "0 20px" } },
      h("div", { style: { maxWidth: 1120, margin: "0 auto", display: "flex", alignItems: "baseline", gap: 10, minHeight: 60, paddingTop: 20 } },
        h("span", { style: { fontFamily: T.fHead, fontSize: 19, fontWeight: 700, color: T.accentMid, letterSpacing: ".5px", textTransform: "uppercase", lineHeight: 1 } }, "HDG HUB"),
        h("span", { style: { fontSize: 12, color: T.headMuted, letterSpacing: "1.5px", textTransform: "uppercase" } }, "painel"))),
    h("div", { style: { maxWidth: 440, margin: "0 auto", padding: "56px 20px" } },
      h("div", { style: { background: T.card, border: "1px solid " + T.border, borderRadius: T.rCont, padding: 32 } }, children)));
}

function LoginView(){
  const [email, setEmail] = useState("");
  const [fase, setFase] = useState("form"); // form | enviando | enviado
  const [erro, setErro] = useState(AUTH.erro);
  const valido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  async function enviar(e){
    e && e.preventDefault();
    if(!valido) return;
    setFase("enviando"); setErro("");
    try{ await AUTH.pedirLink(email.trim().toLowerCase()); setFase("enviado"); }
    catch(x){ setErro(x.message); setFase("form"); }
  }
  if(fase === "enviado") return h(TelaAcesso, null,
    h("div", { className: "ov", style: { marginBottom: 12 } }, "acesso"),
    h("h1", { style: { fontSize: 30, lineHeight: 1.1, marginBottom: 14 } }, "Confira seu e-mail"),
    h("p", { style: { color: T.mutedLight, marginBottom: 24 } }, "Se ", h("strong", { style: { color: T.text } }, email.trim()), " tiver acesso ao painel, um link de entrada chega em instantes. Abra o link neste mesmo navegador. Ele vale por uma hora e funciona uma vez só."),
    h(Btn, { outline: true, onClick: () => setFase("form") }, "Usar outro e-mail"));
  return h(TelaAcesso, null,
    h("div", { className: "ov", style: { marginBottom: 12 } }, "acesso"),
    h("h1", { style: { fontSize: 30, lineHeight: 1.1, marginBottom: 14 } }, "Entrar no painel"),
    h("p", { style: { color: T.mutedLight, marginBottom: 24 } }, "Digite o e-mail cadastrado. Você recebe um link para entrar, sem senha."),
    h("form", { onSubmit: enviar },
      h("label", { htmlFor: "email", style: { display: "block", fontSize: 13, fontWeight: 700, marginBottom: 8 } }, "E-mail"),
      h("input", { id: "email", type: "email", autoComplete: "email", value: email, onChange: e => setEmail(e.target.value), placeholder: "voce@empresa.com.br" }),
      erro && h("p", { role: "alert", style: { color: T.red, fontSize: 13, fontWeight: 600, marginTop: 10 } }, erro),
      h("div", { style: { marginTop: 20 } },
        h("button", { type: "submit", className: "btn btn-p", disabled: !valido || fase === "enviando", style: { width: "100%" } }, fase === "enviando" ? "Enviando..." : "Enviar link de acesso"))));
}

function SemAcessoView(){
  return h(TelaAcesso, null,
    h("div", { className: "ov", style: { marginBottom: 12 } }, "acesso"),
    h("h1", { style: { fontSize: 30, lineHeight: 1.1, marginBottom: 14 } }, "Acesso ainda não liberado"),
    h("p", { style: { color: T.mutedLight, marginBottom: 24 } }, "Você entrou como ", h("strong", { style: { color: T.text } }, AUTH.email()), ", mas esse e-mail ainda não está ligado a nenhuma marca. Fale com a HDG HUB para liberar."),
    h(Btn, { outline: true, onClick: () => AUTH.sair() }, "Sair"));
}

function Root(){
  const [fase, setFase] = useState("checando"); // checando | entrar | sem-acesso | dentro
  useEffect(() => { (async () => {
    AUTH.load(); AUTH.fromHash();
    if(!AUTH.s || !(await AUTH.token())){ setFase("entrar"); return; }
    try{
      const a = await sbFetch("acessos?select=papel,client_id");
      if(!a || !a.length){ setFase("sem-acesso"); return; }
      window.HDG_PAPEL = a.some(x => x.papel === "admin") ? "admin" : "cliente";
      setFase("dentro");
    }catch(e){ AUTH.save(null); AUTH.erro = "Sua sessão terminou. Entre de novo."; setFase("entrar"); }
  })(); }, []);
  if(fase === "checando") return h("div", { style: { display: "flex", alignItems: "center", justifyContent: "center", height: "100vh" } }, h("div", { className: "spinner" }));
  if(fase === "entrar") return h(LoginView);
  if(fase === "sem-acesso") return h(SemAcessoView);
  return h(App);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Root));
</script>
